name: Portfolio checks
on:
  workflow_dispatch:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preview recovery regression
        run: npm run test:preview
      - name: Login security regression
        run: npm run test:auth
      - name: Analysis attempt recovery regression
        run: npm run test:analysis
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
